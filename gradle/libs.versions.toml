androidx-annotation = { group = "androidx.annotation", name = "annotation", version = "1.9.1" }
checkerframework-qual = { group = "org.checkerframework", name = "checker-qual", version = "3.49.5" }
libtorrent4j = { group = "org.libtorrent4j", name = "libtorrent4j", version.ref = "libtorrent4j" }
