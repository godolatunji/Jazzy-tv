name: Release

# Tag vX.Y.Z (or vX.Y.Z-rcN) to publish APKs together with the LGPL source for the bundled FFmpeg
# libraries (core/ffmpeg/LICENSE-NOTICE.md). The source files are attached to the same release as
# the APKs, so whoever downloads an APK can also download the matching source.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APKs
        run: ./gradlew :app:assembleRelease
      - name: Package LGPL sources (FFmpeg)
        run: release/package-lgpl-sources.sh "${GITHUB_REF_NAME#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Jazzy $GITHUB_REF_NAME" \
            --notes "APKs for each ABI plus the universal APK. The FFmpeg (LGPL-2.1+) source used by this build is attached: ffmpeg-7.1.5.tar.xz, the Jazzy build bundle and LGPL-SOURCES.txt." \
            $([[ "$GITHUB_REF_NAME" == *-rc* ]] && echo --prerelease) \
            app/build/outputs/apk/release/*.apk \
            release/out/*
