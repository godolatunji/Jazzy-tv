name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The TMDB read access token comes from a repository secret; builds without it still compile.
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (no live network; live site checks are opt-in)
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew lintDebug
      - name: Assemble
        run: ./gradlew :app:assembleDebug
      - name: Room schemas are committed
        run: git diff --exit-code -- core/database/schemas
      - uses: actions/upload-artifact@v4
        with:
          name: jazzy-debug-apks
          path: app/build/outputs/apk/debug/*.apk
